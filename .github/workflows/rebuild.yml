# Rebuilds the demo once a day from the latest Brain Graph release and the nine vault
# repositories. When either changed, commits site/ and sources.json, then deploys to Pages;
# otherwise it stops after checking the sources.
name: Rebuild demo

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if no source changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rebuild-demo
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: scripts/rebuild.sh ${{ inputs.force && '--force' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: commit
        run: |
          git add -A site sources.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "Rebuild from Brain Graph $(jq -r '."brain-graph".release' sources.json) and the current demo vaults"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: rebuild
    if: needs.rebuild.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
